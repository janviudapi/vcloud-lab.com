---
- hosts: vm01
  gather_facts: no
  vars:
    MAPDRIVE_USER: "{{ lookup('env', 'SA_MAPDRIVE_USER') }}"
    MAPDRIVE_SECRET: "{{ lookup('env', 'SA_MAPDRIVE_SECRET') }}"
  tasks:
    - name: test powershell
      win_shell: |
        get-host
      register: result_get_host

    - name: display result_get_host
      debug:
        var: result_get_host

    # - name: add directory
    #   win_file:
    #     path: C:\apps
    #     state: directory

    # - name: Download the notepad++ installer
    #   win_get_url:
    #     url: https://github.com/notepad-plus-plus/notepad-plus-plus/releases/download/v8.7.8/npp.8.7.8.Installer.x64.exe
    #     dest: C:\apps\npp.8.7.8.Installer.x64.exe
    #     force: true

    - name: Create mapped drive with credentials that do not persist on the next logon
      community.windows.win_mapped_drive:
        letter: Z
        path: \\vcloudlabdemo01scripts.file.core.windows.net\apps
        state: present
        username: localhost\vcloudlabdemo01scripts  #"{{ MAPDRIVE_USER }}" #localhost\vcloudlabdemo01scripts #'{{ ansible_user }}'
        password: kC3B9UoaZEPvWKsocOHvndUtl+5NLc8tJOKLkjliPvWoV7VJpa/6YnZJy1NjjWSRvnlWE86a0XW2+ASto99H0A== #"{{ MAPDRIVE_SECRET }}"

    - name: Install notepad++
      win_shell: |
        $connectTestResult = Test-NetConnection -ComputerName vcloudlabdemo01scripts.file.core.windows.net -Port 445
        if ($connectTestResult.TcpTestSucceeded) {
            # Save the password so the drive will persist on reboot
            cmd.exe /C "cmdkey /add:`"vcloudlabdemo01scripts.file.core.windows.net`" /user:`"localhost\vcloudlabdemo01scripts`" /pass:`"kC3B9UoaZEPvWKsocOHvndUtl+5NLc8tJOKLkjliPvWoV7VJpa/6YnZJy1NjjWSRvnlWE86a0XW2+ASto99H0A==`""
            # Mount the drive
            New-PSDrive -Name Z -PSProvider FileSystem -Root "\\vcloudlabdemo01scripts.file.core.windows.net\apps" -Persist
        } else {
            Write-Error -Message "Unable to reach the Azure storage account via port 445. Check to make sure your organization or ISP is not blocking port 445, or use Azure P2S VPN, Azure S2S VPN, or Express Route to tunnel SMB traffic over a different port."
        }
        dir Z:
#        Z:\npp.8.7.8.Installer.x64.exe /S